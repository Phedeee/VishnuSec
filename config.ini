; =====================================================================
;  config.ini - Configuración de la aplicación SOC
;  Edite este archivo con el Bloc de notas. Los cambios se aplican la
;  próxima vez que abra la aplicación (no hace falta volver a generarla).
;  Las líneas que empiezan con ; son comentarios.
; =====================================================================

[conexion]
; Servidor de PostgreSQL: "localhost" si está en este mismo computador,
; o la dirección IP / nombre del equipo servidor.
host = localhost
puerto = 5432
; Nombre de la base de datos que creó en pgAdmin
base = soc_activos
; Usuarios que aparecen precargados (la contraseña siempre se escribe al iniciar sesión)
usuario = app_lectura
usuario_gestion = app_gestion

[opciones]
; Una consulta que tarde más de estos segundos se cancela automáticamente
tiempo_maximo_consulta_segundos = 30
; Máximo de filas que muestra la pestaña "Consulta libre"
limite_filas_consulta_libre = 1000
